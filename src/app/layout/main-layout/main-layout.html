<!-- ================================================
     WORKSTOCK - LAYOUT PRINCIPAL
================================================ -->

<mat-sidenav-container class="layout-container" [attr.data-workstock-theme]="tema" [attr.data-workstock-palette]="paleta">

  <!-- ============================================
       MENÚ LATERAL
  ============================================= -->

  <mat-sidenav class="sidebar" [mode]="isMobile ? 'over' : 'side'" [opened]="sidebarOpened"
    (openedChange)="sidebarOpened = $event" [autoFocus]="false">

    <app-sidebar (navegar)="cerrarMenuEnMovil()" />

  </mat-sidenav>


  <!-- ============================================
       CONTENIDO PRINCIPAL
  ============================================= -->

  <mat-sidenav-content class="main-column">

    <!-- HEADER -->

    <app-header (menuClick)="toggleMenu()" [tema]="tema" (cambiarTema)="alternarTema()" [paleta]="paleta" (cambiarPaleta)="cambiarPaleta($event)" />

    <!-- CONTENIDO DE CADA MÓDULO -->

    <main class="content" id="contenido-principal">

      <router-outlet />

    </main>

  </mat-sidenav-content>

</mat-sidenav-container>


<!-- ================================================
     INDICADOR GLOBAL DE CARGA

     FUERA DEL MAT-SIDENAV-CONTAINER
     PARA CUBRIR TODA LA PANTALLA
================================================ -->

<app-global-loading />
