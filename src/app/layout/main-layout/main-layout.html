
<!-- ================================================
     WORKSTOCK - LAYOUT PRINCIPAL
================================================ -->

<mat-sidenav-container
  class="layout-container"
  [attr.data-workstock-theme]="tema"
  [attr.data-workstock-palette]="paleta"
>

  <!-- ============================================
       MENÚ LATERAL
  ============================================= -->

  <mat-sidenav
    class="sidebar"
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="sidebarOpened"
    (openedChange)="sidebarOpened = $event"
    [autoFocus]="false"
  >

    <app-sidebar
      (navegar)="cerrarMenuEnMovil()"
    />

  </mat-sidenav>

  <!-- ============================================
       CONTENIDO PRINCIPAL
  ============================================= -->

  <mat-sidenav-content class="main-column">

    <!-- ========================================
         HEADER
    ======================================== -->

    <app-header
      (menuClick)="toggleMenu()"
      [tema]="tema"
      (cambiarTema)="alternarTema()"
      [paleta]="paleta"
      (cambiarPaleta)="cambiarPaleta($event)"
    />

    <!-- ========================================
         INDICADOR DE CAMBIO DE PANTALLA

         Se muestra cuando la navegación
         de Angular tarda más de 180 ms.
    ======================================== -->

    @if (navegacionCargando()) {

      <div
        class="navigation-progress"
        role="progressbar"
        aria-label="Cargando pantalla"
        aria-valuetext="Cargando pantalla"
      >

        <div class="navigation-progress-bar"></div>

      </div>

    }

    <!-- ========================================
         CONTENIDO DE CADA MÓDULO
    ======================================== -->

    <main
      class="content"
      id="contenido-principal"
    >

      <router-outlet />

    </main>

  </mat-sidenav-content>

</mat-sidenav-container>

<!-- ================================================
     INDICADOR GLOBAL HTTP

     Se mantiene fuera del mat-sidenav-container
     para cubrir toda la pantalla.

     Sigue funcionando con loadingInterceptor.
================================================ -->

<app-global-loading />
