<mat-toolbar class="header">

  <!-- MENÚ LATERAL -->
  <button mat-icon-button type="button" class="menu-button" (click)="toggleMenu()" aria-label="Abrir o cerrar menú">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- MARCA WORKSTOCK -->
  <div class="workstock-brand">
    <div class="workstock-text">
      <strong>WorkStock</strong>
      <small>
        {{ esSuperAdmin() ? 'Administración de plataforma' : 'Gestión comercial' }}
      </small>
    </div>
  </div>

  <span class="spacer"></span>

  <!-- CAMBIAR PALETA -->
  <button mat-icon-button type="button" class="palette-toggle" [matMenuTriggerFor]="paletteMenu"
    aria-label="Cambiar colores del sistema" title="Colores de navegación">
    <mat-icon>palette</mat-icon>
  </button>

  <mat-menu #paletteMenu="matMenu" xPosition="before">
    @for (opcion of paletas; track opcion.id) {
    <button mat-menu-item type="button" (click)="cambiarPaleta.emit(opcion.id)">
      <mat-icon [style.color]="opcion.color">circle</mat-icon>
      <span>{{ opcion.nombre }}</span>
      @if (paleta === opcion.id) {
      <mat-icon>check</mat-icon>
      }
    </button>
    }
  </mat-menu>

  <!-- MODO CLARO / OSCURO -->
  <button mat-icon-button type="button" class="theme-toggle" (click)="cambiarTema.emit()"
    [attr.aria-label]="tema === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
    [attr.title]="tema === 'dark' ? 'Modo claro' : 'Modo oscuro'">
    <mat-icon>
      {{ tema === 'dark' ? 'light_mode' : 'dark_mode' }}
    </mat-icon>
  </button>

  <!-- USUARIO -->
  @if (authService.usuario(); as usuario) {
  <button mat-button type="button" [matMenuTriggerFor]="userMenu" class="user-button" aria-label="Opciones de usuario">
    <span class="profile-content">
      <span class="avatar" aria-hidden="true">
        <mat-icon>person_outline</mat-icon>
      </span>
      <span class="user-info">
        <span class="name">{{ usuario.nombre }}</span>
        <span class="role">
          {{ esSuperAdmin() ? 'SUPERADMINISTRADOR' : usuario.rol }}
        </span>
      </span>
      <mat-icon class="arrow" aria-hidden="true">
        keyboard_arrow_down
      </mat-icon>
    </span>
  </button>

  <mat-menu #userMenu="matMenu" xPosition="before">

    <!-- ACTUALIZACIONES -->
    <button mat-menu-item type="button" class="menu-update-item" [disabled]="pwaUpdate.verificando()"
      (click)="buscarActualizaciones()">
      <mat-icon [class.update-spinning]="pwaUpdate.verificando()">
        {{ pwaUpdate.verificando() ? 'sync' : 'system_update_alt' }}
      </mat-icon>
      <span>
        {{ pwaUpdate.verificando()
        ? 'Verificando actualizaciones...'
        : 'Buscar actualizaciones' }}
      </span>
    </button>

    <!-- CERRAR SESIÓN -->
    <button mat-menu-item type="button" (click)="cerrarSesion()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>

  </mat-menu>
  }

</mat-toolbar>
