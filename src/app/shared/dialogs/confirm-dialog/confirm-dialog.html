<div class="confirm-header">
  <div class="icon"><mat-icon>warning_amber</mat-icon></div>
  <div>
    <h2>{{ data.title }}</h2>
    <p>{{ data.message }}</p>
  </div>
</div>


<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancelar()">
    Cancelar
  </button>
  <button mat-flat-button type="button"
    class="confirm-action-btn"
    [attr.data-action]="tipoAccion"
    (click)="confirmar()">
    <mat-icon>{{ iconoConfirmacion }}</mat-icon>
    {{ data.confirmText || 'Confirmar' }}
  </button>
</mat-dialog-actions>
