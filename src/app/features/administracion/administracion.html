<div class="ws-admin-page">


  <!-- =================================================
       ENCABEZADO GENERAL
  ================================================== -->

  <header class="page-header">

    <div>

      <h1>
        Administración
      </h1>


      <p>

        @if (
          esSuperAdmin()
        ) {

          Gestión global de empresas y usuarios de WorkStock

        } @else {

          Gestión de usuarios y accesos de tu empresa

        }

      </p>

    </div>


    <button
      mat-stroked-button
      type="button"
      (click)="actualizar()"
    >

      <mat-icon>
        refresh
      </mat-icon>

      Actualizar

    </button>

  </header>


  <!-- =================================================
       NAVEGACIÓN
  ================================================== -->

  <nav
    class="tabs"
    aria-label="Secciones de administración"
  >


    <!-- ===============================================
         EMPRESAS
    ================================================= -->

    @if (
      esSuperAdmin()
    ) {

      <button
        type="button"
        [class.active]="
          pestana() === 'empresas'
        "
        (click)="
          mostrarPestana('empresas')
        "
      >

        <mat-icon>
          business
        </mat-icon>

        Empresas

      </button>

    }


    <!-- ===============================================
         USUARIOS
    ================================================= -->

    <button
      type="button"
      [class.active]="
        pestana() === 'usuarios'
      "
      (click)="
        mostrarPestana('usuarios')
      "
    >

      <mat-icon>
        group
      </mat-icon>

      Usuarios

    </button>

  </nav>


  <!-- =================================================
       CONTENIDO
  ================================================== -->

  <main class="admin-content">


    <!-- ===============================================
         EMPRESAS
    ================================================= -->

    @if (
      pestana() === 'empresas'
      &&
      esSuperAdmin()
    ) {

      <app-empresas-admin

        (administrarUsuarios)="
          abrirUsuariosEmpresa($event)
        "

      />

    }


    <!-- ===============================================
         USUARIOS
    ================================================= -->

    @if (
      pestana() === 'usuarios'
    ) {

      <app-usuarios-admin

        [idEmpresa]="
          empresaSeleccionadaId()
        "

      />

    }

  </main>

</div>
