<div class="page-header">
  <div>
    <h1>Categorías</h1>
    <p>Administración de categorías de accesorios</p>
  </div>

  <button mat-flat-button class="primary-btn" (click)="nueva()">
    <mat-icon>add</mat-icon>
    Nueva categoría
  </button>
</div>

<div class="card">
  @if (cargando()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <div class="toolbar">
    <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput placeholder="Buscar categoría..." autocomplete="off" (keyup)="filtrar($event)">
    </mat-form-field>

    <span class="records">
      {{ dataSource.filteredData.length }} registros
    </span>
  </div>

  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="col-id">ID</th>
        <td mat-cell *matCellDef="let item" class="col-id">{{ item.id }}</td>
      </ng-container>

      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Categoría</th>
        <td mat-cell *matCellDef="let item" class="category-name">{{ item.categoria }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="col-status">Estado</th>
        <td mat-cell *matCellDef="let item" class="col-status">
          <span class="status" [class.active]="item.estado === 'ACTIVO'">{{ item.estado }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="col-actions">Acciones</th>
        <td mat-cell *matCellDef="let item" class="col-actions">
          <button mat-icon-button class="action edit" matTooltip="Editar" (click)="editar(item)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button class="action delete" matTooltip="Eliminar" (click)="eliminar(item)">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr *matNoDataRow>
        <td class="no-data" [attr.colspan]="displayedColumns.length">
          <mat-icon>search_off</mat-icon>
          <span>No existen registros para mostrar</span>
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 25, 50]"
    showFirstLastButtons
  />
</div>
